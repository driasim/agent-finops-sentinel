[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-finops-sentinel"
version = "0.1.0"
description = "Real-time token budget enforcement, FinOps cost attribution, and runaway spend prevention for LLM agents"
authors = [{ name = "Ibrahim Aliyu Saddique", email = "ibraheemaliyu32@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
